name: Check Telegram public channels
on:
  push:
    paths:
      - '.github/workflows/check-ai-telegram.yml'
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Probe AI channels
        run: |
          python - <<'PY'
          from urllib.request import Request, urlopen
          import re
          names = ['bugnotfeature','ai_machinelearning_big_data','omggpt','ict_moscow_ai','xor_journal','neurohub','AI_Money_Maker','neuraldvig','aidea4work','complete_ai']
          for name in names:
              try:
                  req=Request('https://t.me/s/'+name,headers={'User-Agent':'Mozilla/5.0'})
                  with urlopen(req, timeout=12) as f:
                      page=f.read(900000).decode('utf-8','replace')
                      posts=re.findall(r'data-post=["\']([^"\']+)["\']',page)
                      print('CHANNEL',name,'STATUS',f.status,'POSTS',len(posts),'VIEWS',page.count('tgme_widget_message_views'),'REACTIONS',page.count('tgme_widget_message_reactions'),'FORWARDS',page.count('tgme_widget_message_forwards'), 'LAST',posts[-1] if posts else '')
              except Exception as e:
                  print('CHANNEL',name,'ERROR',str(e)[:140])
          PY
