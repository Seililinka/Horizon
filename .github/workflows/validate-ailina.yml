name: Validate AiLina Editorial Coverage
# Run focused regression suite including AiLina daily freshness, TAAFT and correct fixtures.
on:
  push:
    paths:
      - '.github/workflows/validate-ailina.yml'
  workflow_dispatch:
jobs:
  test-ailina:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@v6
      - name: Install dependencies
        run: uv sync --extra dev
      - name: Compile changed Python modules
        run: python -m compileall -q src
      - name: Run focused test suite
        run: uv run pytest -q tests/test_ailina_postprocess.py tests/test_ailina_practicality.py tests/test_ailina_editorial_feeds.py tests/test_rss.py tests/test_telegram.py tests/test_analyzer.py tests/test_balanced_digest.py tests/test_summarizer.py tests/test_prompting.py
      - name: Validate AiLina config and design assets
        run: |
          uv run python - <<'PY'
          from pathlib import Path
          import json
          from src.models import Config
          config = Config.model_validate(json.loads(Path("data/config.ailina.json").read_text()))
          assert len(config.sources.telegram.channels) == 20
          assert all(any(ch.channel.lower() == name for ch in config.sources.telegram.channels) for name in ('aisetii', 'howto_ai', 'neirofoto_ru'))
          assert config.digest.category_groups['telegram'].limit == 35
          assert all(any(ch.channel.lower() == name for ch in config.sources.telegram.channels) for name in ('bugnotfeature', 'ai_machinelearning_big_data', 'omggpt', 'ict_moscow_ai', 'xor_journal', 'neurohub', 'ai_money_maker', 'neuraldvig', 'aidea4work', 'complete_ai'))
          assert any(ch.channel == 'robofuture' and ch.enabled for ch in config.sources.telegram.channels)
          assert config.digest.max_items == 70\n          assert config.digest.enrichment_limit == 14\n          assert config.processing.profile_settings['ailina'].threshold == 5.0\n          assert config.processing.profile_settings['ailina'].minimum_raw_score == 5.0
          assert len(config.sources.rss) == 16
          assert config.digest.category_groups['taaft_practice'].min_items == 1
          assert config.digest.category_groups['taaft_devices'].min_items == 1\n          assert config.digest.category_groups['karpathy'].min_items == 1\n          assert config.digest.category_groups['anthropic'].min_items == 2
          assert any(x.name == 'The Lancet Digital Health' for x in config.sources.rss)
          assert any(x.name == 'Anthropic Research' and x.category == 'anthropic-ai' for x in config.sources.rss)
          assert any(x.name == 'Andrej Karpathy — Bearblog' and x.category == 'karpathy-ai' for x in config.sources.rss)
          from xml.etree import ElementTree as ET
          rss=ET.fromstring(Path('data/taaft-feed.xml').read_bytes())
          cats={e.text for e in rss.findall('.//item/category')}
          assert {'taaft-prompt', 'taaft-device'} <= cats
          assert Path("docs/_layouts/ailina.html").exists()
          assert Path("docs/assets/css/ailina.css").exists()
          assert Path("docs/assets/js/ailina.js").exists()
          assert "layout: ailina" in Path("docs/ailina.md").read_text()
          print("AiLina Telegram, config and design assets validated")
          PY
