name: Validate TAAFT source and AiLina configuration
on:
  push:
    paths:
      - '.github/workflows/probe-taaft.yml'
      - 'data/taaft-feed.xml'
      - 'data/config.ailina.json'
      - 'src/orchestrator.py'
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.26"
      - run: uv sync
      - name: Validate Python, JSON and RSS
        run: |
          python -m py_compile src/orchestrator.py src/scrapers/rss.py
          uv run python - <<'PY'
          import asyncio
          import json
          import xml.etree.ElementTree as ET
          from pathlib import Path
          import httpx
          from src.models import Config, ProcessingResult, ClassificationResult, ContentAnalysis
          from src.scrapers.rss import RSSScraper
          from src.models import RSSSourceConfig
          from datetime import datetime, timedelta, timezone

          raw = Path('data/taaft-feed.xml').read_text(encoding='utf-8')
          root = ET.fromstring(raw)
          items = root.findall('./channel/item')
          print('LOCAL_TAAFT_ITEMS',len(items))
          assert len(items)>=3
          cfg=Config.model_validate_json(Path('data/config.ailina.json').read_text())
          assert any(s.name=='TAAFT' for s in cfg.sources.rss)
          print('TAAFT_CONFIG_VALIDATED', len(cfg.sources.rss))
          from src.orchestrator import HorizonOrchestrator
          assert hasattr(HorizonOrchestrator, 'editorial_rank_score')
          from src.models import ContentItem
          sample=ContentItem(id='rss:taaft:test', source_type='rss', title='TAAFT test', url='https://newsletter.theresanaiforthat.com/', published_at=datetime.now(timezone.utc), metadata={'feed_name':'TAAFT'}, processing=ProcessingResult(classification=ClassificationResult(profile='ailina', method='source_override'), analysis=ContentAnalysis(score=5.0, reason='test', summary='test')))
          assert HorizonOrchestrator.editorial_rank_score(sample) == 6.5
          sample.metadata['feed_name']='Other'
          assert HorizonOrchestrator.editorial_rank_score(sample) == 5.0
          print('TAAFT_BONUS_VALIDATED', 1.5)
          async def check():
              async with httpx.AsyncClient(timeout=25) as http:
                  rss=RSSScraper([s for s in cfg.sources.rss if s.name=='TAAFT'],http)
                  result=await rss.fetch(datetime.now(timezone.utc)-timedelta(hours=48))
                  print('REMOTE_TAAFT_FETCH',len(result.items),'FAILURES',result.failures)
                  assert len(result.items)>=3
          asyncio.run(check())
          PY
