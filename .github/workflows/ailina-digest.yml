name: AiLina — Daily AI Digest

on:
  schedule:
    # 06:00 UTC = 09:00 Moscow time; GitHub may start scheduled jobs later.
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  daily-ailina:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      DEEPSEEK_API_KEY: ${{ secrets.deepseek || secrets.DEEPSEEK_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check model credentials
        if: ${{ env.DEEPSEEK_API_KEY == '' }}
        run: |
          echo "::error::Missing GitHub Actions repository secret: deepseek (or DEEPSEEK_API_KEY)."
          exit 1

      - name: Set up Python
        if: ${{ env.DEEPSEEK_API_KEY != '' }}
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        if: ${{ env.DEEPSEEK_API_KEY != '' }}
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.26"

      - name: Install dependencies
        if: ${{ env.DEEPSEEK_API_KEY != '' }}
        run: uv sync

      - name: Generate AiLina Russian digest
        if: ${{ env.DEEPSEEK_API_KEY != '' }}
        run: uv run horizon --config data/config.ailina.json --hours 30

      - name: Deploy daily digest to GitHub Pages
        if: ${{ env.DEEPSEEK_API_KEY != '' }}
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          keep_files: true
          publish_branch: gh-pages
          enable_jekyll: true
          commit_message: "AiLina daily AI digest"
