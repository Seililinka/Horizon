name: AiLina — Daily AI Digest

on:
  schedule:
    # 06:00 UTC = 09:00 Moscow time; GitHub may start scheduled jobs later.
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  daily-ailina:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      DEEPSEEK_API_KEY: ${{ secrets.deepseek || secrets.DEEPSEEK_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check model credentials
        if: ${{ env.DEEPSEEK_API_KEY == '' }}
        run: |
          echo "::error::Missing GitHub Actions repository secret: deepseek (or DEEPSEEK_API_KEY)."
          exit 1

      - name: Set up Python
        if: ${{ env.DEEPSEEK_API_KEY != '' }}
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        if: ${{ env.DEEPSEEK_API_KEY != '' }}
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.26"

      - name: Install dependencies
        if: ${{ env.DEEPSEEK_API_KEY != '' }}
        run: uv sync

      - name: Verify DeepSeek API access
        if: ${{ env.DEEPSEEK_API_KEY != '' }}
        run: |
          uv run python - <<'PY'
          import json
          import os
          import sys
          import urllib.error
          import urllib.request

          url = "https://api.deepseek.com/chat/completions"
          body = json.dumps({
              "model": "deepseek-chat",
              "messages": [{"role": "user", "content": "Reply OK"}],
              "max_tokens": 5,
              "stream": False,
          }).encode("utf-8")
          req = urllib.request.Request(url, data=body, headers={
              "Authorization": "Bearer " + os.environ["DEEPSEEK_API_KEY"],
              "Content-Type": "application/json",
          })
          try:
              with urllib.request.urlopen(req, timeout=25) as response:
                  if response.status != 200:
                      raise RuntimeError("Unexpected DeepSeek HTTP status")
              print("DeepSeek API access verified.")
          except urllib.error.HTTPError as exc:
              if exc.code == 401:
                  problem = "DeepSeek rejected the API key (HTTP 401). Create a valid API key in DeepSeek Platform and update the GitHub Actions secret."
              elif exc.code in (402, 403):
                  problem = f"DeepSeek API access/billing was denied (HTTP {exc.code}). Check account access and balance."
              else:
                  problem = f"DeepSeek API returned HTTP {exc.code}. Inspect provider status and configuration."
              print("::error::" + problem)
              sys.exit(1)
          except Exception as exc:
              print("::error::Cannot verify DeepSeek API access. Check network, provider availability and credentials (" + type(exc).__name__ + ").")
              sys.exit(1)
          PY

      - name: Generate AiLina Russian digest
        if: ${{ env.DEEPSEEK_API_KEY != '' }}
        run: uv run horizon --config data/config.ailina.json --hours 30

      - name: Deploy daily digest to GitHub Pages
        if: ${{ env.DEEPSEEK_API_KEY != '' }}
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          keep_files: true
          publish_branch: gh-pages
          enable_jekyll: true
          commit_message: "AiLina daily AI digest"
