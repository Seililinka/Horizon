name: AiLina — Morning & Evening AI Digest

on:
  push:
    paths:
      - 'data/ailina-refresh-request.txt'
  schedule:
    # Morning and evening editions near 09:00 and 19:00 Moscow (UTC+3).
    # Two retries per edition recover delayed or missed scheduled starts.
    - cron: '55 5 * * *'
    - cron: '25 6 * * *'
    - cron: '55 6 * * *'
    - cron: '55 15 * * *'
    - cron: '25 16 * * *'
    - cron: '55 16 * * *'
  workflow_dispatch:
    inputs:
      edition:
        description: "Select AiLina edition"
        type: choice
        options: [morning, evening]
        default: morning
        required: true

# Serialise both editions to prevent concurrent deploys.
concurrency:
  group: ailina-daily-digest
  cancel-in-progress: false

jobs:
  daily-ailina:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Determine edition and target post
        id: edition
        env:
          SCHEDULE_EXPR: ${{ github.event.schedule }}
          MANUAL_EDITION: ${{ inputs.edition }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "schedule" ]]; then
            case "$SCHEDULE_EXPR" in
              '55 15 * * *'|'25 16 * * *'|'55 16 * * *') edition=evening ;;
              *) edition=morning ;;
            esac
          elif [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            edition="${MANUAL_EDITION:-morning}"
          else
            hour=$(TZ=Europe/Moscow date +%H)
            if (( 10#$hour >= 16 )); then edition=evening; else edition=morning; fi
          fi
          today=$(TZ=Europe/Moscow date +%Y-%m-%d)
          echo "name=$edition" >> "$GITHUB_OUTPUT"
          echo "today=$today" >> "$GITHUB_OUTPUT"
          if [[ "$edition" == "evening" ]]; then
            echo "post=_posts/${today}-evening-ru.md" >> "$GITHUB_OUTPUT"
            echo "hours=12" >> "$GITHUB_OUTPUT"
          else
            echo "post=_posts/${today}-summary-ru.md" >> "$GITHUB_OUTPUT"
            echo "hours=24" >> "$GITHUB_OUTPUT"
          fi
          echo "AiLina $edition edition for $today"

      - name: Check whether today's digest is already published
        id: published
        if: ${{ github.event_name == 'schedule' }}
        run: |
          git fetch --no-tags --depth=1 origin gh-pages
          target="${{ steps.edition.outputs.post }}"
          if git cat-file -e "FETCH_HEAD:${target}" 2>/dev/null; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "AiLina ${target} is already published; skip duplicate scheduled run."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check model credentials
        if: ${{ steps.published.outputs.skip != 'true' && env.DEEPSEEK_API_KEY == '' }}
        run: |
          echo "::error::Missing GitHub Actions repository secret: DEEPSEEK_API_KEY."
          exit 1

      - name: Set up Python
        if: ${{ steps.published.outputs.skip != 'true' && env.DEEPSEEK_API_KEY != '' }}
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        if: ${{ steps.published.outputs.skip != 'true' && env.DEEPSEEK_API_KEY != '' }}
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.26"

      - name: Install dependencies
        if: ${{ steps.published.outputs.skip != 'true' && env.DEEPSEEK_API_KEY != '' }}
        run: uv sync

      - name: Verify DeepSeek API access
        if: ${{ steps.published.outputs.skip != 'true' && env.DEEPSEEK_API_KEY != '' }}
        run: |
          uv run python - <<'PY'
          import json
          import os
          import sys
          import urllib.error
          import urllib.request

          url = "https://api.deepseek.com/chat/completions"
          body = json.dumps({
              "model": "deepseek-chat",
              "messages": [{"role": "user", "content": "Reply OK"}],
              "max_tokens": 5,
              "stream": False,
          }).encode("utf-8")
          req = urllib.request.Request(url, data=body, headers={
              "Authorization": "Bearer " + os.environ["DEEPSEEK_API_KEY"],
              "Content-Type": "application/json",
          })
          try:
              with urllib.request.urlopen(req, timeout=25) as response:
                  if response.status != 200:
                      raise RuntimeError("Unexpected DeepSeek HTTP status")
              print("DeepSeek API access verified.")
          except urllib.error.HTTPError as exc:
              if exc.code == 401:
                  problem = "DeepSeek rejected the API key (HTTP 401). Create a valid API key in DeepSeek Platform and update the GitHub Actions secret."
              elif exc.code in (402, 403):
                  problem = f"DeepSeek API access/billing was denied (HTTP {exc.code}). Check account access and balance."
              else:
                  problem = f"DeepSeek API returned HTTP {exc.code}. Inspect provider status and configuration."
              print("::error::" + problem)
              sys.exit(1)
          except Exception as exc:
              print("::error::Cannot verify DeepSeek API access. Check network, provider availability and credentials (" + type(exc).__name__ + ").")
              sys.exit(1)
          PY

      - name: Generate AiLina Russian digest
        if: ${{ steps.published.outputs.skip != 'true' && env.DEEPSEEK_API_KEY != '' }}
        run: uv run horizon --config data/config.ailina.json --hours ${{ steps.edition.outputs.hours }}

      - name: Apply AiLina lavender layout to Russian digest
        if: ${{ steps.published.outputs.skip != 'true' && env.DEEPSEEK_API_KEY != '' }}
        run: |
          python - <<'PY'
          from pathlib import Path
          for path in Path("docs/_posts").glob("*-summary-ru.md"):
              current = path.read_text(encoding="utf-8")
              if current.startswith("---") and "layout: default" in current[:120]:
                  path.write_text(current.replace("layout: default", "layout: ailina", 1), encoding="utf-8")
          PY

      - name: Read recent published digests for freshness filtering
        if: ${{ steps.published.outputs.skip != 'true' }}
        run: |
          mkdir -p .ailina-history
          git fetch --no-tags --depth=1 origin gh-pages
          # Evening excludes today's morning stories. Both runs deduplicate
          # against both editions of the previous three days.
          if [[ "${{ steps.edition.outputs.name }}" == "evening" ]]; then
            today="${{ steps.edition.outputs.today }}"
            git show "FETCH_HEAD:_posts/${today}-summary-ru.md" > ".ailina-history/${today}-summary-ru.md" 2>/dev/null || rm -f ".ailina-history/${today}-summary-ru.md"
          fi
          for offset in 1 2 3; do
            day=$(TZ=Europe/Moscow date -d "$offset day ago" +%Y-%m-%d)
            for part in summary evening; do
              dest=".ailina-history/${day}-${part}-ru.md"
              git show "FETCH_HEAD:_posts/${day}-${part}-ru.md" > "$dest" 2>/dev/null || rm -f "$dest"
            done
          done
          ls -lh .ailina-history || true

      - name: Highlight TAAFT and exclude previously published stories
        if: ${{ steps.published.outputs.skip != 'true' }}
        run: |
          today="${{ steps.edition.outputs.today }}"
          if [[ "${{ steps.edition.outputs.name }}" == "evening" ]]; then
            python scripts/ailina_postprocess.py \
              --current "docs/_posts/${today}-summary-ru.md" \
              --output "docs/_posts/${today}-evening-ru.md" \
              --edition evening \
              --history-dir .ailina-history
          else
            python scripts/ailina_postprocess.py \
              --current "docs/_posts/${today}-summary-ru.md" \
              --edition morning \
              --history-dir .ailina-history
          fi

      - name: Add optional publisher previews without AI
        if: ${{ steps.published.outputs.skip != 'true' && env.DEEPSEEK_API_KEY != '' }}
        timeout-minutes: 2
        continue-on-error: true
        env:
          DEEPSEEK_API_KEY: ""
        run: python -m scripts.ailina_previews "docs/${{ steps.edition.outputs.post }}"

      - name: Deploy daily digest to GitHub Pages
        if: ${{ steps.published.outputs.skip != 'true' && env.DEEPSEEK_API_KEY != '' }}
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          keep_files: true
          publish_branch: gh-pages
          enable_jekyll: true
          commit_message: "AiLina daily AI digest"
